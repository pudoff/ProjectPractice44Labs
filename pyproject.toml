[tool.poetry]
name = "practice44-offline-service"
version = "0.1.0"
description = "PNG to DXF prototype with persistent API/worker jobs"
authors = ["ProjectPractice44Labs contributors"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "==0.116.1"
uvicorn = "==0.35.0"
python-multipart = "==0.0.20"
psycopg = {version = "==3.2.9", extras = ["binary"]}
numpy = "==2.2.6"
scipy = "==1.15.3"
opencv-python = "==4.11.0.86"
scikit-image = "==0.25.2"
ezdxf = "==1.4.5"
rapidocr = "==3.9.2"
onnxruntime = "==1.22.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
httpx = "==0.28.1"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
