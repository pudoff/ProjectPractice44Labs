services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: draw
      POSTGRES_USER: draw
      POSTGRES_PASSWORD: draw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draw"]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &service_env
      DATABASE_URL: postgresql+psycopg://draw:draw@db:5432/draw
      STORAGE_ROOT: /storage
      API_KEY: ${API_KEY:-}
    volumes:
      - storage:/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment: *service_env
    volumes:
      - storage:/storage
    depends_on:
      db:
        condition: service_healthy
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *service_env
    volumes:
      - ./backend/migrations:/srv/migrations
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  storage:
