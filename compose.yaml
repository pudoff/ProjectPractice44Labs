x-app: &app
  image: ${APP_IMAGE:-practice44-backend:0.2.0}
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
    args:
      BUILD_REVISION: ${BUILD_REVISION:-unknown}
  environment: &service_env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-draw}:${POSTGRES_PASSWORD:-draw}@db:5432/${POSTGRES_DB:-draw}
    STORAGE_ROOT: /storage
    CV_ADAPTER: drawcv.adapter:run_cv
    RECOGNITION_PROFILE: current
    OCR_ADAPTER: ${OCR_ADAPTER:-}
    MODEL_DIR: /models
    REQUIRE_LOCAL_MODELS: "true"
    DRAWCV_OFFLINE: "1"
    DRAWCV_STRICT_MODELS: "1"
    POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
    MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-50000000}
  volumes:
    - storage:/storage
    - ./models:/models:ro

services:
  model-assets:
    <<: *app
    profiles: ["tools"]
    # Preparation must not create the application's network before offline mode.
    network_mode: ${MODEL_PREPARATION_NETWORK:-bridge}
    volumes:
      - ./models:/models
    command: ["python", "-m", "tools.fetch_models", "--download"]
  db:
    image: ${POSTGRES_IMAGE:-postgres:16.6-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-draw}
      POSTGRES_USER: ${POSTGRES_USER:-draw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-draw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      retries: 30
  api:
    <<: *app
    # Docker does not publish ports from an internal-only bridge.
    # Recognition and database stay on default; only the HTTP process has ingress.
    networks: [default, api-access]
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  storage:

networks:
  default:
    internal: ${OFFLINE_NETWORK_INTERNAL:-false}
  api-access:
    driver: bridge
