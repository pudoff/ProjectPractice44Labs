[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drawcv"
version = "0.1.0"
description = "OpenCV module of the drawing digitisation service (joint project with 44labs): page preparation, lines/circles/arcs, contours and defects -> cv.json"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "shapely>=2.0",
    "pillow>=10",
    "pypdfium2>=4",
    "rapidocr>=3.4",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
dev = ["ezdxf>=1.3", "pydantic>=2.8", "pytest>=8", "pyflakes>=3"]

[project.scripts]
drawcv = "drawcv.__main__:main"

[tool.setuptools]
packages = ["drawcv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
