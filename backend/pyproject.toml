[project]
name = "drawing-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "drawcv",
  "paddleocr==3.7.0",
  "paddlepaddle==3.2.0",
  "numpy==2.3.5",
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.6,<3",
  "ezdxf>=1.3,<2",
  "Pillow==12.1.0",
  "PyMuPDF>=1.24,<2",
  "opencv-contrib-python==4.10.0.84",
  "scikit-image>=0.24,<1",
  "scipy>=1.14,<2",
  "rapidocr==3.10.0",
  "onnxruntime>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "aiosqlite>=0.20,<1", "numpy>=1.26,<3"]

[tool.uv]
package = false
# RapidOCR's headless wheel and PaddleX's contrib wheel both provide cv2.
# Use one tested provider for both (see docs/ocr-integration.md).
exclude-dependencies = ["opencv-python-headless"]

[tool.uv.sources]
drawcv = { path = "../mlcv", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
