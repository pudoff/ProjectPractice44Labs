[project]
name = "drawing-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.6,<3",
  "ezdxf>=1.3,<2",
  "Pillow>=10,<12",
  "PyMuPDF>=1.24,<2",
  "opencv-python-headless>=4.10,<5",
  "scikit-image>=0.24,<1",
  "scipy>=1.14,<2",
  "rapidocr==3.10.0",
  "onnxruntime>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "aiosqlite>=0.20,<1", "numpy>=1.26,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
